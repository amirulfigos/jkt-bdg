function bal(){const b={};S.pp.forEach(p=>b[p.id]={paid:0,owed:0,net:0});

 while(cr.length&&db.length){const x=Math.min(cr[0][1],db[0][1]);tr.push({from:db[0][0],to:cr[0][0],amt:x});cr[0][1]-=x;db[0][1]-=x;if(!cr[0][1])cr.shift();if(!db[0][1])db.shift()}
 return{b,tr}}
